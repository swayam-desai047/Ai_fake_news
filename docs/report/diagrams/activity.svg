<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 860' width='760' height='860'><defs><marker id='open' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10' fill='none' stroke='#111' stroke-width='1.4'/></marker><marker id='solid' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#111'/></marker><marker id='tri' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='11' markerHeight='11' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='white' stroke='#111'/></marker></defs><rect width='100%' height='100%' fill='white'/><circle cx='300' cy='25' r='11' fill='#111'/><text x='320' y='29' font-size='11' text-anchor='start' font-weight='normal' font-style='italic' font-family='Times New Roman, serif' fill='#111'>every 30 minutes (APScheduler)</text><line x1='300' y1='36' x2='300' y2='55' stroke='#111' stroke-width='1.2' marker-end='url(#open)'/><rect x='150' y='55' width='300' height='36' rx='14' fill='#f4f4f4' stroke='#111' stroke-width='1.2'/><text x='300' y='78' font-size='12' text-anchor='middle' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>Fetch RSS feeds (timeout 15 s)</text><line x1='300' y1='91' x2='300' y2='115' stroke='#111' stroke-width='1.2' marker-end='url(#open)'/><rect x='150' y='115' width='300' height='36' rx='14' fill='#f4f4f4' stroke='#111' stroke-width='1.2'/><text x='300' y='138' font-size='12' text-anchor='middle' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>Clean HTML, parse date, drop repeats in batch</text><line x1='300' y1='151' x2='300' y2='175' stroke='#111' stroke-width='1.2' marker-end='url(#open)'/><polygon points='300,175.0 405.0,205 300,235.0 195.0,205' fill='#f4f4f4' stroke='#111' stroke-width='1.2'/><text x='300' y='209.0' font-size='11' text-anchor='middle' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>Feed failed?</text><line x1='405' y1='205' x2='520' y2='205' stroke='#111' stroke-width='1.2' marker-end='url(#open)'/><rect x='520' y='187' width='200' height='36' rx='14' fill='#f4f4f4' stroke='#111' stroke-width='1.2'/><text x='620' y='210' font-size='12' text-anchor='middle' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>Log + add to failed list</text><text x='420' y='199' font-size='11' text-anchor='start' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>[yes]</text><line x1='300' y1='235' x2='300' y2='260' stroke='#111' stroke-width='1.2' marker-end='url(#open)'/><polygon points='300,260.0 405.0,290 300,320.0 195.0,290' fill='#f4f4f4' stroke='#111' stroke-width='1.2'/><text x='300' y='287.5' font-size='11' text-anchor='middle' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>Already stored?</text><text x='300' y='300.5' font-size='11' text-anchor='middle' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>(title / URL)</text><line x1='405' y1='290' x2='520' y2='290' stroke='#111' stroke-width='1.2' marker-end='url(#open)'/><rect x='520' y='272' width='200' height='36' rx='14' fill='#f4f4f4' stroke='#111' stroke-width='1.2'/><text x='620' y='295' font-size='12' text-anchor='middle' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>Skip (duplicate)</text><text x='420' y='284' font-size='11' text-anchor='start' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>[yes]</text><text x='308' y='336' font-size='11' text-anchor='start' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>[no]</text><line x1='300' y1='320' x2='300' y2='345' stroke='#111' stroke-width='1.2' marker-end='url(#open)'/><rect x='150' y='345' width='300' height='36' rx='14' fill='#f4f4f4' stroke='#111' stroke-width='1.2'/><text x='300' y='368' font-size='12' text-anchor='middle' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>Score 8 dimensions (rules)</text><line x1='300' y1='381' x2='300' y2='405' stroke='#111' stroke-width='1.2' marker-end='url(#open)'/><rect x='150' y='405' width='300' height='36' rx='14' fill='#f4f4f4' stroke='#111' stroke-width='1.2'/><text x='300' y='428' font-size='12' text-anchor='middle' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>Run classifier + sentiment model (if available)</text><line x1='300' y1='441' x2='300' y2='465' stroke='#111' stroke-width='1.2' marker-end='url(#open)'/><rect x='150' y='465' width='300' height='36' rx='14' fill='#f4f4f4' stroke='#111' stroke-width='1.2'/><text x='300' y='488' font-size='12' text-anchor='middle' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>Combine risk score, label, summary</text><line x1='300' y1='501' x2='300' y2='525' stroke='#111' stroke-width='1.2' marker-end='url(#open)'/><polygon points='300,523.0 415.0,555 300,587.0 185.0,555' fill='#f4f4f4' stroke='#111' stroke-width='1.2'/><text x='300' y='552.5' font-size='11' text-anchor='middle' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>Enough evidence?</text><text x='300' y='565.5' font-size='11' text-anchor='middle' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>(≥ 65 % risk weight)</text><line x1='415' y1='555' x2='520' y2='555' stroke='#111' stroke-width='1.2' marker-end='url(#open)'/><rect x='520' y='537' width='220' height='36' rx='14' fill='#f4f4f4' stroke='#111' stroke-width='1.2'/><text x='630' y='560' font-size='12' text-anchor='middle' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>Label = not assessed</text><text x='425' y='549' font-size='11' text-anchor='start' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>[no]</text><line x1='300' y1='587' x2='300' y2='610' stroke='#111' stroke-width='1.2' marker-end='url(#open)'/><polyline points='630,573 630,599 306,599' fill='none' stroke='#111' stroke-width='1.2' marker-end='url(#open)'/><polygon points='300,608.0 425.0,640 300,672.0 175.0,640' fill='#f4f4f4' stroke='#111' stroke-width='1.2'/><text x='300' y='637.5' font-size='11' text-anchor='middle' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>Ambiguous score, short text,</text><text x='300' y='650.5' font-size='11' text-anchor='middle' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>low confidence or disagreement?</text><line x1='425' y1='640' x2='520' y2='640' stroke='#111' stroke-width='1.2' marker-end='url(#open)'/><rect x='520' y='622' width='220' height='36' rx='14' fill='#f4f4f4' stroke='#111' stroke-width='1.2'/><text x='630' y='645' font-size='12' text-anchor='middle' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>Flag Needs Verification</text><text x='435' y='634' font-size='11' text-anchor='start' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>[yes]</text><line x1='300' y1='672' x2='300' y2='695' stroke='#111' stroke-width='1.2' marker-end='url(#open)'/><polyline points='630,658 630,684 306,684' fill='none' stroke='#111' stroke-width='1.2' marker-end='url(#open)'/><rect x='150' y='695' width='300' height='36' rx='14' fill='#f4f4f4' stroke='#111' stroke-width='1.2'/><text x='300' y='718' font-size='12' text-anchor='middle' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>Store article in Supabase</text><line x1='300' y1='731' x2='300' y2='753' stroke='#111' stroke-width='1.2' marker-end='url(#open)'/><rect x='150' y='753' width='300' height='36' rx='14' fill='#f4f4f4' stroke='#111' stroke-width='1.2'/><text x='300' y='776' font-size='12' text-anchor='middle' font-weight='normal' font-style='normal' font-family='Times New Roman, serif' fill='#111'>Re-group recent articles (TF-IDF)</text><line x1='300' y1='789' x2='300' y2='811' stroke='#111' stroke-width='1.2' marker-end='url(#open)'/><circle cx='300' cy='821' r='12' fill='white' stroke='#111' stroke-width='1.5'/><circle cx='300' cy='821' r='7' fill='#111'/></svg>